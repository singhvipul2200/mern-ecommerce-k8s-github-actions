name: MERN E-commerce CI/CD

on:
  push:
    branches:
      - main

    # Prevent the GitOps commit from triggering
    # the complete CI/CD pipeline again.
    paths-ignore:
      - "mern-ecommerce/values.yaml"

  workflow_dispatch:

# Required so GitHub Actions can commit
# the updated Helm values back to main.
permissions:
  contents: write

jobs:

  # ============================================================
  # JOB 1 - UNIT TESTS / LINT
  # ============================================================

  unit-tests:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # -------------------------
      # Backend
      # -------------------------

      - name: Install Backend Dependencies
        run: npm ci

      - name: Backend Test Check
        run: |
          echo "Backend does not have a test script."
          echo "Skipping backend unit tests."

      # -------------------------
      # Frontend
      # -------------------------

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Lint
        working-directory: frontend
        run: npm run lint


  # ============================================================
  # JOB 2 - SONARCLOUD
  # ============================================================

  sonarcloud:
    name: SonarCloud Analysis
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ============================================================
  # JOB 3 - BUILD & PUSH DOCKER IMAGES
  # ============================================================

  build-and-push:
    name: Build & Push Docker Images

    needs:
      - unit-tests
      - sonarcloud

    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -------------------------
      # Docker Buildx
      # -------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # -------------------------
      # Docker Hub Login
      # -------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ========================================================
      # BACKEND IMAGE
      # ========================================================

      - name: Build & Push Backend Image
        id: backend-build

        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./backend/Dockerfile

          push: true

          tags: |
            vipulsingh2200/mern-ecommerce-backend:latest
            vipulsingh2200/mern-ecommerce-backend:${{ github.sha }}


      # ========================================================
      # FRONTEND IMAGE
      # ========================================================

      - name: Build & Push Frontend Image
        id: frontend-build

        uses: docker/build-push-action@v6

        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          push: true

          tags: |
            vipulsingh2200/mern-ecommerce-frontend:latest
            vipulsingh2200/mern-ecommerce-frontend:${{ github.sha }}


      # ========================================================
      # DOCKER BUILD SUMMARY
      # ========================================================

      - name: Docker Build Summary
        run: |

          echo "======================================"
          echo "Docker images built successfully"
          echo "======================================"

          echo ""

          echo "Backend:"
          echo "vipulsingh2200/mern-ecommerce-backend:latest"
          echo "vipulsingh2200/mern-ecommerce-backend:${{ github.sha }}"

          echo ""

          echo "Frontend:"
          echo "vipulsingh2200/mern-ecommerce-frontend:latest"
          echo "vipulsingh2200/mern-ecommerce-frontend:${{ github.sha }}"

          echo ""

          echo "Backend Digest:"
          echo "${{ steps.backend-build.outputs.digest }}"

          echo ""

          echo "Frontend Digest:"
          echo "${{ steps.frontend-build.outputs.digest }}"


      # ========================================================
      # GITOPS
      # UPDATE HELM IMAGE TAGS
      # ========================================================

      - name: Update Helm Image Tags

        env:
          IMAGE_TAG: ${{ github.sha }}

        run: |

          python - <<'PY'

          from pathlib import Path
          import re
          import os

          path = Path("mern-ecommerce/values.yaml")

          text = path.read_text()

          image_tag = os.environ["IMAGE_TAG"]

          # Update backend tag
          text = re.sub(
              r'(backend:\s*\n\s*image:\s*\n\s*repository:.*\n\s*tag:)\s*"[^"]*"',
              rf'\1 "{image_tag}"',
              text,
              count=1
          )

          # Update frontend tag
          text = re.sub(
              r'(frontend:\s*\n\s*image:\s*\n\s*repository:.*\n\s*tag:)\s*"[^"]*"',
              rf'\1 "{image_tag}"',
              text,
              count=1
          )

          path.write_text(text)

          PY


          echo "======================================"
          echo "Updated Helm values"
          echo "======================================"

          cat mern-ecommerce/values.yaml


      # ========================================================
      # GITOPS
      # COMMIT HELM CHANGE BACK TO MAIN
      # ========================================================

      - name: Commit and Push Helm Changes

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add mern-ecommerce/values.yaml

          git commit \
            -m "chore: update image tags to ${GITHUB_SHA}" \
            || echo "No changes to commit"

          git push origin HEAD:main
